name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit && npm run lint && jest — the whole gate in one command,
      # so a red CI means a red `npm run verify` locally too.
      - name: Verify (typecheck + lint + tests)
        run: npm run verify
