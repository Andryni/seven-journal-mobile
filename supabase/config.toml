# Supabase CLI project config.
#
# Without this file the CLI does not recognise the directory as a project, so
# `supabase functions deploy coach` never finds supabase/functions/coach and
# nothing is published -- which is why the app got a 404 from a function whose
# source was sitting right here.
#
# project_id is only the local label. The deployment target is chosen by
# `supabase link --project-ref <ref>`, which writes .supabase/ (gitignored).
project_id = "seven-journal-mobile"

[functions.coach]
# Left at the default (true) deliberately.
#
# The function's own guard only checks that an Authorization header is
# PRESENT -- it never validates the token. On its own that is not a real
# check: any caller can send `Authorization: Bearer x` and reach the model.
# The gateway's verify_jwt is what actually rejects an unauthenticated
# caller, so turning it off here would leave a public proxy to a paid API.
verify_jwt = true

[functions.chat]
# Same reasoning as coach: the function only checks that a bearer token is
# PRESENT, so the gateway must be the one that validates it.
verify_jwt = true

[functions.sync-ingest]
# The ONLY function where this must be false, and it is not an oversight.
#
# coach and chat are called by the app, which holds a Supabase session, so
# the gateway can verify a JWT. This one is called by an Expert Advisor
# running inside MetaTrader on the trader's PC. It has no Supabase session
# and cannot obtain one; it authenticates with a per-connector secret that
# the function itself looks up in sync_ingest_accounts.
#
# Left at the default, the gateway rejects every EA request with 401 before
# the function runs, and the bridge silently never imports anything.
#
# This is safe precisely because the function does its own check: an unknown
# or inactive secret is refused, and the secret scopes every write to its own
# connector's staging rows. Do not copy this line to another function.
verify_jwt = false

[functions.calendar]
# Gateway-verified like coach and chat: the app holds a session, and nothing
# here is per-user, so there is no reason to widen access.
verify_jwt = true
